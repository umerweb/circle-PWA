<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline · Circle Fund</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      width: 48px;
      height: 48px;
      line-height: 48px;
      border-radius: 50%;
      background: #15803d;
      color: white;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px 0;
      color: #0f172a;
    }
    p {
      font-size: 13px;
      color: #64748b;
      margin: 0 0 20px 0;
      line-height: 1.5;
    }
    button {
      background: #16a34a;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #15803d;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">CF</div>
    <h1>You are currently offline</h1>
    <p>
      Circle Fund requires an active connection to verify financial figures and MobilePay transactions safely.
      <br><br>
      <em>(Du er i øjeblikket offline. Circle Fund kræver internetforbindelse for sikker adgang til regnskabet.)</em>
    </p>
    <button onclick="window.location.reload()">Retry Connection / Prøv igen</button>
  </div>
</body>
</html>
